# Asteri Nginx config.
# Replace yourdomain.com and ASTERI_ROOT (the folder containing frontend/ and backend/) before use.

# Redirect www to the apex domain
server {
    listen 80;
    listen [::]:80;
    server_name www.yourdomain.com;
    return 301 $scheme://yourdomain.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    server_tokens off;

    # Security headers (Certbot adds the HTTPS block; HSTS only takes effect over HTTPS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy in REPORT-ONLY mode: violations are logged in the browser console
    # but nothing is blocked. Switch to Content-Security-Policy once the reports are clean.
    # 'unsafe-inline' is needed for the framework's inline hydration scripts and the inline styles.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self'; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Gzip settings for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    client_max_body_size 10m;

    # Old URLs -> lowercase slugs (301)
    location = /Partnership {
        return 301 $scheme://$host/partnership;
    }
    location = /Asteri_product-suite {
        return 301 $scheme://$host/products;
    }
    location = "/Services- Salesforce Consulting" {
        return 301 $scheme://$host/services/salesforce;
    }

    # Hashed build assets: cache for a year (file names change on every build)
    location /assets/ {
        root ASTERI_ROOT/frontend/.output/public;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static files from the public folder: served by Nginx, not Node
    location ~* \.(png|jpe?g|webp|svg|gif|ico|otf|woff2?|ttf|mp4)$ {
        root ASTERI_ROOT/frontend/.output/public;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
